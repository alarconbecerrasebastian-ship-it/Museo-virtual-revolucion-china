<!-- 🎧 AUDIOGUÍAS DEL MUSEO -->
<style>
.audioguia {
    margin-top: 20px;
    padding: 20px;
    border-radius: 15px;
    background: #f1f1f1;
    border: 2px solid #c9c9c9;
}

.audioguia h3 {
    margin-top: 0;
}

.audio-controles {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.audio-controles button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.btn-play {
    background: #222;
    color: white;
}

.btn-pausa {
    background: #777;
    color: white;
}

.btn-stop {
    background: #b3261e;
    color: white;
}

.audio-estado {
    margin-top: 10px;
    font-size: 14px;
    color: #555;
}
</style>

<div class="audioguia">
    <h3>🎧 Audioguía</h3>

    <p>
        Escuchá la explicación de esta sala sobre la propaganda,
        Mao y la Revolución China.
    </p>

    <div class="audio-controles">
        <button class="btn-play" onclick="reproducirAudio()">
            ▶️ Escuchar audioguía
        </button>

        <button class="btn-pausa" onclick="pausarAudio()">
            ⏸️ Pausar
        </button>

        <button class="btn-stop" onclick="detenerAudio()">
            ⏹️ Detener
        </button>
    </div>

    <div class="audio-estado" id="estadoAudio">
        Audio detenido
    </div>
</div>

<script>
const textoAudioguia = `
Bienvenidos a esta sala del Museo Virtual de la Revolución China.

En esta sala podemos observar cómo la propaganda presentó a Mao Zedong
como una figura central del proceso revolucionario.

En numerosos carteles y publicaciones, Mao aparece en un lugar destacado,
mientras que alrededor suyo se representan trabajadores, campesinos,
jóvenes y soldados.

Estas imágenes transmitían ideas como unidad, liderazgo y participación
colectiva. La propaganda no solamente comunicaba información, sino que
también buscaba transmitir una determinada imagen del líder y de la sociedad.

Al mismo tiempo, los carteles mostraban algunos aspectos de la realidad
mientras dejaban otros en segundo plano. Por eso es importante analizar
qué aparece en una imagen y qué queda afuera.

La propaganda estuvo relacionada con el poder porque ayudó a difundir
mensajes oficiales y a construir una determinada representación de la
Revolución y de sus protagonistas.

La pregunta que queda para el visitante es:

¿La propaganda mostraba la realidad o construía una imagen de cómo debía
ser la sociedad?
`;

let vozActual = null;

function buscarVoz() {
    const voces = speechSynthesis.getVoices();

    return voces.find(v => 
        v.lang.toLowerCase().startsWith("es-ar")
    ) || voces.find(v => 
        v.lang.toLowerCase().startsWith("es")
    ) || voces[0];
}

function reproducirAudio() {

    speechSynthesis.cancel();

    vozActual = new SpeechSynthesisUtterance(textoAudioguia);

    vozActual.lang = "es-AR";
    vozActual.rate = 0.9;
    vozActual.pitch = 1;
    vozActual.volume = 1;

    const voz = buscarVoz();

    if (voz) {
        vozActual.voice = voz;
    }

    vozActual.onstart = function() {
        document.getElementById("estadoAudio").textContent =
            "🔊 Reproduciendo audioguía...";
    };

    vozActual.onend = function() {
        document.getElementById("estadoAudio").textContent =
            "✅ Audioguía terminada";
    };

    speechSynthesis.speak(vozActual);
}

function pausarAudio() {

    if (speechSynthesis.speaking && !speechSynthesis.paused) {
        speechSynthesis.pause();

        document.getElementById("estadoAudio").textContent =
            "⏸️ Audioguía pausada";
    }
}

function detenerAudio() {

    speechSynthesis.cancel();

    document.getElementById("estadoAudio").textContent =
        "⏹️ Audio detenido";
}

speechSynthesis.onvoiceschanged = function() {
    buscarVoz();
};
</script>
